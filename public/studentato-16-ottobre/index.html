<title>La stazione AI del gruppo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: presentazione a schermo intero, una tappa per schermata. In alto una linea di metropolitana (linea verde = studentato, ora; linea blu = gruppo e sanità, dopo) che mostra dove siamo nel percorso. Stessa famiglia visiva delle pagine Italia Salute. */
:root{
  --bg:#0C1614; --bg2:#13211D; --card:#16241F; --ink:#FFFFFF; --ink2:#DCE6E2; --soft:#9FB2AB; --faint:#6F857D;
  --line:rgba(255,255,255,.1);
  --a:#00C27B; --a-d:#4FD9A4; --a-l:rgba(0,194,123,.14);
  --b:#5B8DEF; --b-d:#9DBBF5; --b-l:rgba(91,141,239,.16);
  --hub:#F2C14E;
  --disp:'Space Grotesk',-apple-system,'Segoe UI',sans-serif;
  --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.025em;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}

/* barra in alto: linea della metro */
.rail{flex-shrink:0;border-bottom:1px solid var(--line);background:var(--bg)}
.rail-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--disp);font-size:13px;font-weight:600;white-space:nowrap;color:var(--soft)}
.brand b{color:#fff}
.track{display:flex;align-items:center;position:relative;height:22px}
.track::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:3px;transform:translateY(-50%);background:linear-gradient(90deg,var(--a) 0 var(--split),var(--b) var(--split) 100%);opacity:.35;border-radius:3px}
.dots{position:relative;display:flex;justify-content:space-between;width:100%}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--a);background:var(--bg);padding:0;cursor:pointer;flex-shrink:0;transition:transform .15s}
.dot.lb{border-color:var(--b)}
.dot.hub{border-color:var(--hub);width:16px;height:16px;margin-top:-2px}
.dot.n{border-color:var(--faint)}
.dot.past{background:currentColor}
.dot.a.past{background:var(--a)} .dot.lb.past{background:var(--b)} .dot.hub.past{background:var(--hub)} .dot.n.past{background:var(--faint)}
.dot[aria-current="step"]{transform:scale(1.45);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.tlab{display:grid;grid-template-columns:var(--split) 1fr;font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.tlab span:first-child{color:var(--a-d)} .tlab span:last-child{color:var(--b-d);padding-left:4px}
.trackwrap{flex:1;min-width:0;--split:50%}
.count{font-family:var(--disp);font-size:13px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.count b{color:#fff}
@media(max-width:640px){.brand{display:none}.dot{width:8px;height:8px;border-width:2px}.dot.hub{width:11px;height:11px;margin-top:-1.5px}}

/* palco */
.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.slide{max-width:1180px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(28px,6vh,72px);display:flex;flex-direction:column;justify-content:center;animation:in .35s ease both}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:22px}
.lbadge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;font-size:13px;letter-spacing:.14em;border-radius:100px;background:var(--a-l);color:var(--a-d)}
.lbadge i{width:20px;height:20px;border-radius:50%;background:var(--a);color:#062418;font-style:normal;display:inline-flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:0}
.lbadge.b{background:var(--b-l);color:var(--b-d)} .lbadge.b i{background:var(--b);color:#0A1A3A}
.lbadge.h{background:rgba(242,193,78,.14);color:var(--hub)} .lbadge.h i{background:var(--hub);color:#2A1E00}
.chip{padding:5px 11px;border-radius:100px;border:1px solid var(--line);color:var(--ink2);letter-spacing:.08em}
h1.big{font-size:clamp(36px,6.4vw,74px);max-width:16ch}
h1.big span{color:var(--a)}
h2.ttl{font-size:clamp(30px,5vw,56px);max-width:18ch}
.lead{font-size:clamp(17px,2vw,21px);color:var(--soft);max-width:58ch;margin-top:20px;line-height:1.5}

/* tappa */
.stop{display:grid;gap:22px;margin-top:34px}
@media(min-width:900px){.stop{grid-template-columns:1fr 1fr;gap:28px}}
.said,.do{border-radius:16px;padding:24px 26px;min-width:0}
.said{background:var(--bg2);border:1px solid var(--line)}
.said .k,.do .k{font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:12px}
.said .k{color:var(--faint)}
.said q{display:block;font-family:var(--disp);font-size:clamp(19px,2.3vw,25px);line-height:1.35;color:#fff;quotes:"«" "»";font-weight:500;letter-spacing:-.01em}
.do{background:var(--a-l);border:1px solid rgba(0,194,123,.35)}
.do .k{color:var(--a-d)}
.do p{font-size:clamp(16px,1.7vw,18.5px);line-height:1.55;color:var(--ink2)}
.do ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.do li{font-size:15.5px;color:var(--ink2);padding-left:20px;position:relative;line-height:1.45}
.do li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--a)}
.slide.lineB .do{background:var(--b-l);border-color:rgba(91,141,239,.4)} .slide.lineB .do .k{color:var(--b-d)} .slide.lineB .do li::before{background:var(--b)}
.next{margin-top:26px;font-size:14.5px;color:var(--soft);display:flex;gap:10px;align-items:baseline;max-width:70ch}
.next b{font-family:var(--disp);color:#fff;font-weight:600;white-space:nowrap}

/* mappa */
.map{margin-top:22px;display:grid;gap:12px}
.mline{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.mline.a{border-color:rgba(0,194,123,.35)} .mline.b{border-color:rgba(91,141,239,.4)}
.mline h3{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mline h3 small{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--soft);letter-spacing:0}
.sw{width:28px;height:6px;border-radius:3px;background:var(--a)}
.mline.b .sw{background:var(--b)}
.stations{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.st{flex-direction:column;gap:6px!important;hyphens:auto;overflow-wrap:break-word;font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink2);cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.3}
.st:hover{border-color:var(--a)}
.mline.b .st:hover{border-color:var(--b)}
.st i{font-style:normal;font-family:var(--disp);font-weight:700;font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--a);color:#062418;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mline.b .st i{background:var(--b);color:#0A1A3A}
.hubrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px dashed rgba(242,193,78,.5);border-radius:12px;color:var(--ink2);font-size:14.5px;cursor:pointer;background:transparent;font:inherit;text-align:left}
.hubrow i{width:24px;height:24px;border-radius:50%;background:var(--hub);flex-shrink:0}

/* stazione: come funziona */
.flow{margin-top:34px;display:grid;gap:12px}
@media(min-width:900px){.flow{grid-template-columns:repeat(4,1fr)}}
.fs{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;position:relative}
.fs .n{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--hub)}
.fs h3{font-size:19px;margin:8px 0 8px}
.fs p{font-size:14.5px;color:var(--soft);line-height:1.5}
.fs.op{border-color:rgba(242,193,78,.45)}

/* due livelli */
.two{margin-top:34px;display:grid;gap:14px}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr}}
.lv{border-radius:16px;padding:24px;min-width:0;border:1px solid var(--line);background:var(--bg2)}
.lv.a{border-color:rgba(0,194,123,.4)} .lv.b{border-color:rgba(91,141,239,.4)}
.lv .k{font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.lv.a .k{color:var(--a-d)} .lv.b .k{color:var(--b-d)}
.lv q{display:block;font-family:var(--disp);font-size:20px;line-height:1.35;margin:10px 0 12px;quotes:"«" "»"}
.lv p{font-size:15px;color:var(--soft);line-height:1.5}
.rules{margin-top:14px;display:grid;gap:10px}
@media(min-width:900px){.rules{grid-template-columns:repeat(3,1fr)}}
.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14.5px;color:var(--ink2);line-height:1.45;min-width:0}
.rule b{display:block;font-family:var(--disp);color:#fff;margin-bottom:4px}

/* primo passo */
.tiers{margin-top:30px;display:grid;gap:12px}
@media(min-width:900px){.tiers{grid-template-columns:repeat(3,1fr)}}
.tier{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0}
.tier.rec{border-color:var(--a);box-shadow:0 0 0 3px var(--a-l)}
.tier .nm{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--a-d);display:flex;justify-content:space-between;gap:8px}
.tier .pr{font-family:var(--disp);font-size:38px;font-weight:700;letter-spacing:-.03em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tier .tm{font-size:13px;color:var(--soft);margin-bottom:10px}
.tier ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink2);line-height:1.5}
.tier ul.tl2{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.tier ul.tl2 li{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink2);line-height:1.4}
.tier ul.tl2 li i{font-style:normal;font-family:var(--disp);font-weight:700;font-size:11px;width:20px;height:20px;border-radius:50%;background:var(--a);color:#062418;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:-1px}
.tier ul.tl2 li i.jump{cursor:pointer;outline-offset:2px} .tier ul.tl2 li i.jump:hover{box-shadow:0 0 0 3px var(--a-l)}
.mline.p{border-color:rgba(242,193,78,.45)} .mline.p .sw{background:var(--hub)} .mline.p .st i{background:var(--hub);color:#2A1E00} .mline.p .st.strong{border-color:var(--hub);color:#fff;font-weight:600}
.tier ul.tl2 li.plain{color:var(--soft);font-size:13.5px}
.start{margin-top:16px;display:grid;gap:10px}
@media(min-width:900px){.start{grid-template-columns:repeat(4,1fr)}}
.sx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink2);min-width:0}
.sx b{display:block;font-family:var(--disp);color:#fff;font-size:15px;margin-bottom:2px}
.when{margin-top:16px;border:1px solid rgba(0,194,123,.35);border-radius:14px;padding:16px 18px;background:var(--a-l)}
.when .k{font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--a-d)}
.wg{display:grid;gap:8px;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.wi{font-size:14px;color:var(--ink2)} .wi b{display:block;font-family:var(--disp);color:#fff;font-size:17px}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.qbtn{font:inherit;font-size:15px;font-weight:600;border-radius:100px;padding:12px 20px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:#fff}
.qbtn.go{background:var(--a);border-color:var(--a);color:#062418}
.fine{margin-top:18px;font-size:13px;color:var(--faint);max-width:90ch;line-height:1.5}
.fine a{color:var(--a-d)}

/* comandi */
.ctrl{flex-shrink:0;border-top:1px solid var(--line);background:var(--bg)}
.ctrl-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ctrl button{font:inherit;font-size:14.5px;font-weight:600;border-radius:100px;padding:11px 20px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:#fff;min-width:0}
.ctrl button.go{background:var(--a);border-color:var(--a);color:#062418}
.ctrl button[disabled]{opacity:.3;cursor:default}
.ctrl .mapbtn{background:transparent;color:var(--soft)}
.hint{font-size:12.5px;color:var(--faint)}
@media(max-width:640px){.hint{display:none}.ctrl button{padding:10px 14px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}.dot{transition:none}}
</style>
</head>
<body>

<div class="rail"><div class="rail-in">
  <div class="brand"><b>Ivano Sciretta</b> · call del 16 ottobre 2026</div>
